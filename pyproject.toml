[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba_shot_quality"
version = "0.1.0"
description = "Calibrated NBA xFG model on free nba_api playoff data. Methodology-first, not accuracy-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shaurya" }]
keywords = ["nba", "basketball", "xgboost", "shot-quality", "sports-analytics"]

dependencies = [
    "nba_api>=1.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
    "freezegun>=1.4",
]

[tool.setuptools.packages.find]
include = ["nba_shot_quality*"]
exclude = ["tests*", "notebooks*", "scripts*"]
# CLI scripts: invoked via `python scripts/run_pipeline.py` (the scripts add
# their own sys.path bootstrap). No console-script entry points because the
# scripts/ directory is intentionally excluded from the installed wheel.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["nba_shot_quality"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# Target: 90% on machines with libomp (Mac: brew install libomp; Linux: usually present).
# Without libomp, XGBoost import fails and tests/test_train_xgb.py skips, leaving
# train.train_with_cv uncovered. 85% is the floor when XGBoost is environment-gated.
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
